[project]
name = "claude-router"
version = "0.1.0"
description = "A local Claude-compatible proxy router for Ollama and cloud AI providers"
readme = "README.md"
authors = [
    { name = "Adarsh Battu", email = "adarsh.battu109@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[project.scripts]
claude-router = "claude_router:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
