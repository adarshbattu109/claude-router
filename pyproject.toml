[project]
name = "claude-router"
version = "0.1.0"
description = "A local Claude-compatible proxy router for Ollama and cloud AI providers"
readme = "README.md"
authors = [
    { name = "Adarsh Battu", email = "adarsh.battu109@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[project.scripts]
claude-router = "claude_router:main"

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src", "app" = "app"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["claude_router*", "helpers*", "constants*", "app*"]
