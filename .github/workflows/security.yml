name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv export --frozen --no-dev --format requirements.txt -o requirements.txt
      - run: uv tool run pip-audit -r requirements.txt
